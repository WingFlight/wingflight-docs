site_name: WingFlight Documentation
site_description: Documentation for the WingFlight flight controller firmware and configurator
site_url: https://doc.wingflight.org/
repo_url: https://github.com/WingFlight
repo_name: WingFlight
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/wf_icon_white.svg # white variant of the same artwork, for contrast against the red toolbar
  favicon: assets/favicon.ico
  font: false # use the system-font stack from color-palette.html instead of a fetched webfont
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/WingFlight
    - icon: fontawesome/brands/discord
      link: https://discord.gg/aEyyAJTXRw/

